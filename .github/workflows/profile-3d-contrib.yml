name: 3D Profile Contribution

on:
  schedule:
    - cron: "0 */6 * * *"   # har 6 ghante baad update
  workflow_dispatch:         # manual trigger ka button bhi mil jayega

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: generate profile 3d contribution
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
      - name: commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f profile-3d-contrib/*.svg
          git commit -m "generate 3D contribution svg" || exit 0
          git push
