name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6366F1&color_dots=#e2e8f0,#a5d8d0,#64c9b8,#2DD4BF,#6366F1
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2DD4BF&color_dots=#1c2333,#134e42,#166f5c,#34D399,#2DD4BF
      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{
