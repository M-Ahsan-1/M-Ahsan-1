<svg width="800" height="90" viewBox="0 0 800 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05050a"/>
      <stop offset="50%" stop-color="#0b0b16"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.18
                0 0 0 0 0.83
                0 0 0 0 0.75
                0 0 0 0.06 0"/>
      <animate xlink:href="#turb" attributeName="baseFrequency" dur="0.35s" values="0.9;0.75;0.95;0.8;0.9" repeatCount="indefinite"/>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="800" height="90" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="90" fill="url(#bg)"/>

    <!-- static noise layer -->
    <rect width="800" height="90" filter="url(#noise)"/>

    <!-- scanlines -->
    <g opacity="0.35">
      <rect y="0" width="800" height="1" fill="#000" opacity="0"/>
      <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="4" height="1" fill="#000" opacity="0.45"/>
      </pattern>
      <rect width="800" height="90" fill="url(#lines)"/>
    </g>

    <!-- vertical sweep beam ("searching for signal") -->
    <rect x="-40" y="0" width="40" height="90" fill="url(#beam)">
      <animate attributeName="x" values="-40;840" dur="2.4s" repeatCount="indefinite"/>
    </rect>

    <!-- terminal readout text -->
    <text x="24" y="34" font-family="Courier New, monospace" font-size="14" fill="#6366F1" opacity="0.9">
      &gt; scanning_frequency...
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.6s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="58" font-family="Courier New, monospace" font-size="15" letter-spacing="2" fill="#2DD4BF" font-weight="bold">
      SIGNAL LOCKED
      <animate attributeName="x" values="24;25;23;24" dur="0.25s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="58" font-family="Courier New, monospace" font-size="15" letter-spacing="2" fill="#ff2d95" opacity="0.5">
      SIGNAL LOCKED
      <animate attributeName="x" values="26;24;27;26" dur="0.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5;0" dur="0.6s" repeatCount="indefinite"/>
    </text>

    <!-- channel indicator dots, right side -->
    <g transform="translate(690,20)">
      <circle cx="0" cy="0" r="4" fill="#2DD4BF">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="18" cy="0" r="4" fill="#6366F1">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="36" cy="0" r="4" fill="#2DD4BF">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="-64" y="5" font-family="Courier New, monospace" font-size="12" fill="#6366F1" opacity="0.7">CH.01</text>
    </g>

    <!-- frame border like an old TV bezel -->
    <rect x="1" y="1" width="798" height="88" rx="6" fill="none" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>
</svg>
