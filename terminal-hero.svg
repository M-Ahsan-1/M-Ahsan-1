<svg width="800" height="210" viewBox="0 0 800 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b16"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence id="turb2" type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.18
                0 0 0 0 0.83
                0 0 0 0 0.75
                0 0 0 0.045 0"/>
      <animate xlink:href="#turb2" attributeName="baseFrequency" dur="0.4s" values="0.85;0.7;0.9;0.85" repeatCount="indefinite"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.4"/>
    </pattern>
    <clipPath id="rounded">
      <rect x="0" y="0" width="800" height="210" rx="10"/>
    </clipPath>
    <clipPath id="revealCmd">
      <rect x="0" y="0" width="0" height="26">
        <animate id="revealCmdAnim" attributeName="width" from="0" to="255" dur="1.1s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="revealOut">
      <rect x="0" y="0" width="0" height="26">
        <animate id="revealOutAnim" attributeName="width" from="0" to="470" dur="1.5s" begin="revealCmdAnim.end+0.15s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="800" height="210" fill="url(#bgGrad)"/>
    <rect width="800" height="210" filter="url(#grain)"/>
    <rect width="800" height="210" fill="url(#scan)" opacity="0.5"/>
    <rect width="800" height="210" fill="url(#vignette)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="800" height="34" fill="#0d0d18" opacity="0.9"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="17" r="6" fill="#febc2e"/>
    <circle cx="62" cy="17" r="6" fill="#2DD4BF"/>
    <text x="400" y="22" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#8b8fa3">ahsan@kryzon: ~</text>
    <line x1="0" y1="34" x2="800" y2="34" stroke="#2DD4BF" stroke-opacity="0.15"/>

    <!-- prompt line -->
    <g clip-path="url(#revealCmd)">
      <text x="40" y="88" font-family="Courier New, monospace" font-size="21" fill="#2DD4BF">ahsan@kryzon:~$ whoami</text>
    </g>
    <rect x="285" y="70" width="10" height="22" fill="#2DD4BF">
      <animate attributeName="x" values="40;295" dur="1.1s" begin="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0" dur="0.01s" begin="revealCmdAnim.end" fill="freeze"/>
    </rect>

    <!-- output line -->
    <g clip-path="url(#revealOut)">
      <text x="40" y="128" font-family="Courier New, monospace" font-size="21" font-weight="bold" fill="#f4f4f6">Ahsan — Full-Stack Dev &amp; Game Dev</text>
    </g>
    <rect x="0" y="110" width="10" height="22" fill="#f4f4f6">
      <animate attributeName="x" values="40;510" dur="1.5s" begin="revealCmdAnim.end+0.15s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="revealCmdAnim.end+0.15s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="revealOutAnim.end" repeatCount="indefinite"/>
    </rect>

    <!-- static status line -->
    <text x="40" y="164" font-family="Courier New, monospace" font-size="14" fill="#6366F1" opacity="0">
      FAST-NUCES · CS Sophomore · C++ / SFML · React
      <animate attributeName="opacity" values="0;0;1" dur="0.6s" begin="revealOutAnim.end+0.2s" fill="freeze"/>
    </text>
    <text x="40" y="186" font-family="Courier New, monospace" font-size="14" fill="#8b8fa3" opacity="0">
      portfolio → kryzon.vercel.app
      <animate attributeName="opacity" values="0;0;1" dur="0.6s" begin="revealOutAnim.end+0.6s" fill="freeze"/>
    </text>

    <rect x="1" y="1" width="798" height="208" rx="10" fill="none" stroke="#2DD4BF" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>
</svg>
