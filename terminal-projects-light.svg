<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGlow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="rowBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rowsClip"><rect x="46" y="158" width="1008" height="182" rx="8"/></clipPath>
  </defs>

  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace;}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes rowSweep{0%{transform:translateY(0)}100%{transform:translateY(182px)}}
    @keyframes dotFade{0%,100%{opacity:.3}50%{opacity:1}}
    .cursor{animation:blink 1s step-end infinite}
    .beam{animation:rowSweep 3.6s linear infinite}
    .dot{animation:dotFade 1.6s ease-in-out infinite}
  </style>

  <rect x="2" y="2" width="1096" height="556" rx="14" fill="#ffffff" stroke="url(#borderGlow2)" stroke-width="1.5"/>
  <rect x="2.5" y="2.5" width="1095" height="42" rx="13" fill="#f1f3f9"/>
  <rect x="2.5" y="24" width="1095" height="21" fill="#f1f3f9"/>
  <circle cx="26" cy="23" r="6" fill="#F87171"/>
  <circle cx="46" cy="23" r="6" fill="#d97706"/>
  <circle cx="66" cy="23" r="6" fill="#059669"/>
  <text x="550" y="27" text-anchor="middle" class="mono" font-size="13" fill="#5b6478">ahsan@kryzon: ~/projects</text>
  <line x1="2.5" y1="45" x2="1097.5" y2="45" stroke="#dde1ea" stroke-width="1"/>

  <g class="mono">
    <text x="46" y="76" font-size="15" fill="#059669">ahsan@kryzon:~/projects$ <tspan fill="#1f2430">ls -la</tspan><tspan class="cursor" fill="#0d9488">_</tspan></text>
    <text x="46" y="98" font-size="12" fill="#4b5568">total 6</text>

    <circle class="dot" cx="1030" cy="72" r="3.5" fill="#0d9488"/>
    <text x="1042" y="76" font-size="11" fill="#64748B">live</text>

    <!-- legend: decoding permission notation -->
    <text x="46" y="122" font-size="12" fill="#64748B">
      <tspan fill="#0d9488">d</tspan> = directory &#183;
      <tspan fill="#4b5568"> -</tspan> = file &#183;
      <tspan fill="#d97706"> rwx</tspan> = read / write / execute (owner &#183; group &#183; others)
    </text>
  </g>

  <line x1="46" y1="136" x2="1054" y2="136" stroke="#dde1ea" stroke-dasharray="4 4"/>

  <!-- rows box with scanning beam -->
  <rect x="46" y="158" width="1008" height="182" fill="#f1f3f9"/>
  <g clip-path="url(#rowsClip)">
    <rect x="46" y="76" width="1008" height="60" fill="url(#rowBeam)" class="beam"/>
  </g>
  <rect x="46" y="158" width="1008" height="182" fill="none" stroke="#dde1ea"/>

  <g class="mono" font-size="14">
    <!-- kryzon -->
    <text x="66" y="182"><tspan fill="#0d9488">d</tspan><tspan fill="#4b5568">rwxr-xr-x</tspan></text>
    <text x="200" y="182" font-weight="700" fill="#0d9488" text-decoration="underline">kryzon/</text>
    <text x="390" y="182" fill="#5b6478">&#8594; portfolio &#183; <tspan fill="#1f2430">kryzon.vercel.app</tspan></text>

    <!-- daakhla -->
    <text x="66" y="214"><tspan fill="#0d9488">d</tspan><tspan fill="#4b5568">rwxr-xr-x</tspan></text>
    <text x="200" y="214" font-weight="700" fill="#0d9488" text-decoration="underline">daakhla/</text>
    <text x="390" y="214" fill="#5b6478">&#8594; admissions merit calculator &#183; <tspan fill="#1f2430">daakhla.vercel.app</tspan></text>

    <!-- safarnama -->
    <text x="66" y="246"><tspan fill="#0d9488">d</tspan><tspan fill="#4b5568">rwxr-xr-x</tspan></text>
    <text x="200" y="246" font-weight="700" fill="#0d9488" text-decoration="underline">safarnama/</text>
    <text x="390" y="246" fill="#5b6478">&#8594; northern Pakistan travel guide &#183; <tspan fill="#1f2430">safarnama.vercel.app</tspan></text>

    <!-- appbridge -->
    <text x="66" y="278"><tspan fill="#4b5568">drwxr-xr-x</tspan></text>
    <text x="200" y="278" font-weight="700" fill="#64748B">appbridge/</text>
    <text x="390" y="278" fill="#5b6478">&#8594; MCP integrations for Claude Desktop</text>
    <rect x="770" y="266" width="94" height="18" rx="9" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-opacity="0.5"/>
    <text x="817" y="279" text-anchor="middle" font-size="9.5" fill="#d97706">IN PROGRESS</text>

    <!-- hangman -->
    <text x="66" y="310"><tspan fill="#4b5568">-rwxr-xr-x</tspan></text>
    <text x="200" y="310" font-weight="700" fill="#1f2430">hangman.cpp</text>
    <text x="390" y="310" fill="#5b6478">&#8594; C++ / SFML</text>

    <!-- tower defence -->
    <text x="66" y="335"><tspan fill="#4b5568">-rwxr-xr-x</tspan></text>
    <text x="200" y="335" font-weight="700" fill="#1f2430">tower_defence.cpp</text>
    <text x="390" y="335" fill="#5b6478">&#8594; C++ / SFML</text>
  </g>

  <line x1="46" y1="356" x2="1054" y2="356" stroke="#dde1ea" stroke-dasharray="4 4"/>

  <!-- game notes -->
  <g class="mono" font-size="12.5">
    <text x="46" y="380" fill="#4b5568">// <tspan fill="#5b6478">hangman.cpp</tspan> &#8212; classic word-guessing game with ASCII art lives &amp; replayable rounds</text>
    <text x="46" y="402" fill="#4b5568">// <tspan fill="#5b6478">tower_defence.cpp</tspan> &#8212; wave-based tower defense with custom pathfinding &amp; collision</text>
  </g>

  <line x1="46" y1="420" x2="1054" y2="420" stroke="#dde1ea" stroke-dasharray="4 4"/>

  <!-- tools -->
  <text x="46" y="446" class="mono" font-size="14" fill="#059669">$ <tspan fill="#5b6478">cat tools.txt</tspan></text>

  <g class="mono" font-size="12" font-weight="600">
    <rect x="46" y="462" width="62" height="26" rx="13" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-opacity="0.5"/>
    <text x="77" y="479" text-anchor="middle" fill="#0d9488">React</text>

    <rect x="116" y="462" width="52" height="26" rx="13" fill="#4f46e5" fill-opacity="0.14" stroke="#4f46e5" stroke-opacity="0.5"/>
    <text x="142" y="479" text-anchor="middle" fill="#4f46e5">Vite</text>

    <rect x="176" y="462" width="80" height="26" rx="13" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="216" y="479" text-anchor="middle" fill="#38BDF8">Tailwind</text>

    <rect x="264" y="462" width="56" height="26" rx="13" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-opacity="0.5"/>
    <text x="292" y="479" text-anchor="middle" fill="#d97706">C++</text>

    <rect x="328" y="462" width="58" height="26" rx="13" fill="#F87171" fill-opacity="0.14" stroke="#F87171" stroke-opacity="0.5"/>
    <text x="357" y="479" text-anchor="middle" fill="#F87171">SFML</text>

    <rect x="394" y="462" width="66" height="26" rx="13" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.5"/>
    <text x="427" y="479" text-anchor="middle" fill="#A78BFA">Vercel</text>

    <rect x="468" y="462" width="94" height="26" rx="13" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-opacity="0.5"/>
    <text x="515" y="479" text-anchor="middle" fill="#059669">Git / GitHub</text>
  </g>

  <text x="46" y="524" class="mono" font-size="11" fill="#4b5568">$ echo "3 shipped &#183; 1 building &#183; 2 compiled"</text>
</svg>
