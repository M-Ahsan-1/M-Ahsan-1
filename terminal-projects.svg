<svg width="800" height="290" viewBox="0 0 800 290" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b16"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <radialGradient id="vignette2" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain2">
      <feTurbulence id="turb3" type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.18
                0 0 0 0 0.83
                0 0 0 0 0.75
                0 0 0 0.045 0"/>
    </filter>
    <pattern id="scan2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.4"/>
    </pattern>
    <clipPath id="rounded2">
      <rect x="0" y="0" width="800" height="290" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded2)">
    <rect width="800" height="290" fill="url(#bgGrad2)"/>
    <rect width="800" height="290" filter="url(#grain2)"/>
    <rect width="800" height="290" fill="url(#scan2)" opacity="0.5"/>
    <rect width="800" height="290" fill="url(#vignette2)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="800" height="34" fill="#0d0d18" opacity="0.9"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="17" r="6" fill="#febc2e"/>
    <circle cx="62" cy="17" r="6" fill="#2DD4BF"/>
    <text x="400" y="22" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#8b8fa3">ahsan@kryzon: ~/projects</text>
    <line x1="0" y1="34" x2="800" y2="34" stroke="#2DD4BF" stroke-opacity="0.15"/>

    <!-- prompt -->
    <text x="30" y="64" font-family="Courier New, monospace" font-size="16" fill="#2DD4BF">ahsan@kryzon:~/projects$ ls -la</text>

    <!-- column headers -->
    <text x="30" y="90" font-family="Courier New, monospace" font-size="12" fill="#5a5d6e">total 6</text>

    <!-- rows -->
    <g font-family="Courier New, monospace" font-size="14">
      <a xlink:href="https://kryzon.vercel.app" target="_blank">
        <text x="30" y="116" fill="#2DD4BF">drwxr-xr-x</text>
        <text x="150" y="116" fill="#f4f4f6" font-weight="bold">kryzon/</text>
        <text x="330" y="116" fill="#6366F1">→ portfolio</text>
      </a>

      <a xlink:href="https://daakhla.vercel.app" target="_blank">
        <text x="30" y="144" fill="#2DD4BF">drwxr-xr-x</text>
        <text x="150" y="144" fill="#f4f4f6" font-weight="bold">daakhla/</text>
        <text x="330" y="144" fill="#6366F1">→ admissions merit calculator</text>
      </a>

      <a xlink:href="https://safarnama-pak.vercel.app" target="_blank">
        <text x="30" y="172" fill="#2DD4BF">drwxr-xr-x</text>
        <text x="150" y="172" fill="#f4f4f6" font-weight="bold">safarnama/</text>
        <text x="330" y="172" fill="#6366F1">→ northern Pakistan travel guide</text>
      </a>

      <text x="30" y="200" fill="#2DD4BF">drwxr-xr-x</text>
      <text x="150" y="200" fill="#f4f4f6" font-weight="bold">appbridge/</text>
      <text x="330" y="200" fill="#febc2e">→ MCP integrations · in progress</text>

      <text x="30" y="228" fill="#8b8fa3">-rwxr-xr-x</text>
      <text x="150" y="228" fill="#f4f4f6">hangman.cpp</text>
      <text x="330" y="228" fill="#6366F1">→ C++ / SFML</text>

      <text x="30" y="256" fill="#8b8fa3">-rwxr-xr-x</text>
      <text x="150" y="256" fill="#f4f4f6">tower_defence.cpp</text>
      <text x="330" y="256" fill="#6366F1">→ C++ / SFML</text>
    </g>

    <rect x="1" y="1" width="798" height="288" rx="10" fill="none" stroke="#2DD4BF" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>
</svg>
